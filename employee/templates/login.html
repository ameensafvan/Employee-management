{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Login | EMS</title>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-100 to-indigo-200 flex items-center justify-center">
    <div class="bg-white shadow-2xl rounded-2xl flex max-w-4xl w-full overflow-hidden">

        <div class="hidden md:block w-1/2 bg-cover bg-center">
            <img src="{% static 'images/Login-side-image.png' %}" alt="Login" class="w-full h-full object-cover">
        </div>

        <div class="w-full md:w-1/2 p-8 md:p-12">
            <h2 class="text-3xl font-bold text-gray-700 text-center mb-6">Welcome</h2>
            <p class="text-center text-gray-500 mb-6">Login to your EMS account</p>

            <form method="POST" action="{% url 'login' %}" class="space-y-4 animate-fadeIn">
                {% csrf_token %}

                <div>
                    <label class="block text-gray-600">Username</label>
                    <input type="text" name="username" placeholder="Enter your username"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                        required>
                </div>

                <div>
                    <label class="block text-gray-600">Password</label>
                    <input type="password" name="password" placeholder="Enter your password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                        required>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-semibold">Sign
                    In</button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-400">Don't have access?
                <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Register here</a>
            </p>
        </div>
    </div>

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>

    {% if error %}
    <script>
        alert("{{ error }}");
    </script>
    {% endif %}

    {% if messages %}
    <script>
        {% for message in messages %}
        alert("{{ message }}");
        {% endfor %}
    </script>
    {% endif %}
</body>

</html>

{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Register</h2>

    <form method="post" enctype="multipart/form-data" class="space-y-6" novalidate>
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ field.label }}
            </label>

            {{ field }}

            {% if field.errors %}
            <p class="mt-1 text-sm text-red-600">{{ field.errors|striptags }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div>
            <button type="submit"
                class="w-full flex items-center justify-center gap-2 bg-blue-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-700 transition">
                <i class='bx bx-user-plus text-xl'></i> Register
            </button>
        </div>
    </form>
</div>

{% endblock %}

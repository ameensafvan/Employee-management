{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md mt-10">
    <div class="text-center">
        <img src="{% static 'images/prf_pic.webp' %}" class="w-24 h-24 rounded-full mx-auto mb-4" alt="Profile Image">
        <h2 class="text-2xl font-semibold">{{ employee.name }}</h2>
        <p class="text-gray-500">{{ employee.job.title }}</p>
    </div>
    <div class="mt-6 space-y-2 text-sm text-gray-700">
        <p><strong>Mobile:</strong> {{ employee.mobile }}</p>
        <p><strong>Phone:</strong> {{ employee.phone }}</p>
        <p><strong>Country:</strong> {{ employee.country.name }}</p>
        <p><strong>City:</strong> {{ employee.city }}</p>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% load static %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md mt-10">
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">Edit Employee</h2>
    <div class="flex justify-center mb-6">
        {% if employee.profile_photo %}
            <img src="{{ employee.profile_photo.url }}" alt="{{ employee.name }}'s profile" class="w-24 h-24 rounded-full object-cover border-4 border-blue-200">
        {% else %}
            <img src="{% static 'images/prf_pic.webp' %}" alt="default profile" class="w-24 h-24 rounded-full object-cover border-4 border-blue-200">
        {% endif %}
    </div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="grid grid-cols-1 gap-4">
            <input type="text" name="name" value="{{ employee.name }}" class="input-style">
            <input type="text" name="mobile" value="{{ employee.mobile }}" class="input-style">
            <input type="text" name="phone" value="{{ employee.phone }}" class="input-style">
            <select name="country" class="input-style">
                {% for country in countries %}
                    <option value="{{ country.id }}" {% if country.id == employee.country.id %}selected{% endif %}>{{ country.name }}</option>
                {% endfor %}
            </select>
            <input type="text" name="city" value="{{ employee.city }}" class="input-style">
            <select name="job" class="input-style">
                {% for job in jobs %}
                    <option value="{{ job.id }}" {% if job.id == employee.job.id %}selected{% endif %}>{{ job.title }}</option>
                {% endfor %}
            </select>
            
            <input type="file" name="profile_photo" class="input-style">
        </div>
        <button type="submit" class="w-full mt-6 bg-yellow-500 text-white py-2 rounded-lg hover:bg-yellow-600 transition">
            Update Employee
        </button>
    </form>
</div>
{% endblock %}

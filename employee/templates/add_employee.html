{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Add New Employee</h2>
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" name="name" placeholder="Enter name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Mobile -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
            <input type="text" name="mobile" placeholder="Enter mobile number"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Phone -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
            <input type="text" name="phone" placeholder="Enter phone number"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Country -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
            <select name="country"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">Select Country</option>
                {% for country in countries %}
                <option value="{{ country.id }}">{{ country.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- City -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
            <input type="text" name="city" placeholder="Enter city"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Job Title -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
            <select name="job"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">Select Job Title</option>
                {% for job in jobs %}
                <option value="{{ job.id }}">{{ job.title }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Profile Photo -->
        <div>
            <label for="profile_photo" class="block text-sm font-medium text-gray-700 mb-1">Profile Photo</label>
            <input type="file" name="profile_photo" id="profile_photo" accept="image/*"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <p class="text-xs text-gray-500 mt-1">Optional. Upload a profile picture (JPG, PNG, etc.)</p>
        </div>

        <!-- Submit Button -->
        <div>
            <button type="submit"
                class="w-full flex items-center justify-center gap-2 bg-blue-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-700 transition">
                <i class='bx bx-plus-medical text-xl'></i> Add Employee
            </button>
        </div>
    </form>
</div>

{% endblock %}
